name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "scripts/apply-supabase-migrations.sh"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: yrdcsbjlvgycipzpogbv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra secret
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Chưa có secret SUPABASE_ACCESS_TOKEN - bỏ qua deploy Supabase."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - name: Áp dụng migration mới
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/apply-supabase-migrations.sh
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest
      - name: Deploy edge function
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy provision-workspace-admin --project-ref "$PROJECT_REF" --use-api
