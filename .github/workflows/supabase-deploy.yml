name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "scripts/apply-supabase-migrations.sh"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: yrdcsbjlvgycipzpogbv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra secret
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Chưa có secret SUPABASE_ACCESS_TOKEN - bỏ qua deploy Supabase."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - name: Áp dụng migration mới
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/apply-supabase-migrations.sh
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest
      - name: Deploy edge function
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy provision-workspace-admin --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy send-invite-email --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy send-queued-emails --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Đặt secret gửi email cho edge function
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          umask 077
          f="$(mktemp)"
          for k in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_FROM_NAME APP_URL; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> "$f"; else echo "Bỏ qua $k (chưa có secret)"; fi
          done
          if [ -s "$f" ]; then supabase secrets set --env-file "$f" --project-ref "$PROJECT_REF" >/dev/null && echo "Đã cập nhật secret email"; fi
          rm -f "$f"
